[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "postgres-database-agent"
version = "0.1.0"
description = "Production-style LangGraph natural-language-to-PostgreSQL agent"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Database Agent Project"}]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "sqlalchemy>=2.0,<2.2",
  "psycopg[binary]>=3.2,<4.0",
  "langgraph>=1.0,<2.0",
  "langchain-core>=1.0,<2.0",
  "langchain-openai>=1.0,<2.0",
  "sqlglot>=25,<40",
  "structlog>=24,<27",
  "prometheus-client>=0.20,<1.0",
  "httpx>=0.27,<1.0",
  "typer>=0.12,<1.0",
  "rich>=13,<15",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1.0",
]

[project.scripts]
db-agent = "db_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/db_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
