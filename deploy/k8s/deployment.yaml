apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-database-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: postgres-database-agent
  template:
    metadata:
      labels:
        app: postgres-database-agent
    spec:
      containers:
        - name: api
          image: your-registry/postgres-database-agent:0.1.0
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: postgres-database-agent-secrets
            - configMapRef:
                name: postgres-database-agent-config
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-database-agent-config
data:
  ALLOWED_SCHEMAS: "public"
  MAX_ROWS: "100"
  STATEMENT_TIMEOUT_MS: "5000"
  SCHEMA_TOP_K: "12"
  RETURN_SQL: "false"
  RETURN_ROWS: "false"
